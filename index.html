<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>তথ্য সংগ্রহ ফর্ম</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: rgba(168, 85, 247, 0.4);
            --bg-gradient: radial-gradient(circle at 50% 0%, #0f172a 0%, #030712 65%, #000000 100%);
            --glass-bg: rgba(15, 23, 42, 0.85);
            --input-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
            --shadow-3d: 0 25px 50px -12px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; transition: all 0.3s ease; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* 3D Ambient Glow */
        body::before, body::after {
            content: ''; position: absolute; width: 400px; height: 400px;
            border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.3;
        }
        body::before { background: #7c3aed; top: -50px; left: -50px; }
        body::after { background: #0284c7; bottom: -50px; right: -50px; }

        /* Password Overlay */
        #password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 7, 18, 0.88);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .password-box {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: var(--shadow-3d);
        }

        .password-box h3 { font-size: 22px; margin-bottom: 8px; color: var(--text-main); font-weight: 700; }
        .password-box p { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }

        /* Form Container */
        .form-container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            padding: 35px 30px;
            border-radius: 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-3d);
            border: 1px solid var(--border-color);
            display: none; /* পাসওয়ার্ড দিয়ে আনলক হবে */
            transform-style: preserve-3d;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            padding: 12px 16px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px var(--primary-glow), inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        /* ফর্মের ইনপুট বক্সে রঙ (আপনার মূল কোডের শর্ত)[span_3](start_span)[span_3](end_span) */
        .start-date { border: 2px solid green !important; outline-color: green; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 10px rgba(34, 197, 94, 0.2); }
        .end-date { border: 2px solid red !important; outline-color: red; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 10px rgba(239, 68, 68, 0.2); }
        
        button {
            padding: 14px 20px;
            background: linear-gradient(135deg, #7c3aed 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            margin-top: 10px;
        }

        button:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(124, 58, 237, 0.6);
        }

        button:active { transform: translateY(1px); }

        #message {
            margin-top: 15px;
            color: #4ade80;
            font-weight: bold;
            display: none;
            text-align: center;
            background: rgba(34, 197, 94, 0.15);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        #passError {
            color: #f87171;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }
        
        /* মেধা স্বত্ব ডিজাইন[span_4](start_span)[span_4](end_span) */
        .copyright {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <!-- পাসওয়ার্ড ওভারলে -->
    <div id="password-overlay">
        <div class="password-box">
            <h3>🔒 সিকিউরিটি ভেরিফিকেশন</h3>
            <p>ফরমে প্রবেশ করতে পাসওয়ার্ড প্রদান করুন</p>
            <input type="password" id="passInput" style="text-align: center; margin-bottom: 15px;" placeholder="পাসওয়ার্ড লিখুন..." onkeypress="handleKeyPress(event)">
            <button onclick="verifyPassword()">আনলক করুন</button>
            <div id="passError">ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</div>
        </div>
    </div>

    <div class="form-container" id="mainFormContainer">
        <h2 style="text-align: center; margin-bottom: 20px; color: #f8fafc; font-size: 24px;">পদের তথ্য জমা দিন</h2>
        <form id="dataForm">
            <div class="form-group">
                <label for="jobTitle">পদের নাম:</label>
                <input type="text" id="jobTitle" name="jobTitle" placeholder="যেমন: সহকারী শিক্ষক" required>
            </div>
            <div class="form-group">
                <label for="startDate">শুরুর তারিখ:</label>
                <input type="date" id="startDate" name="startDate" class="start-date" required>
            </div>
            <div class="form-group">
                <label for="endDate">শেষ তারিখ:</label>
                <input type="date" id="endDate" name="endDate" class="end-date" required>
            </div>
            <div class="form-group">
                <label for="vacancies">পদ সংখ্যা:</label>
                <input type="number" id="vacancies" name="vacancies" placeholder="যেমন: ৫" required>
            </div>
            <button type="submit" id="submitBtn">তথ্য জমা দিন</button>
            <div id="message">তথ্য সফলভাবে গুগল শিটে জমা হয়েছে!</div>
        </form>
        
        <!-- মেধা স্বত্ব সেকশন[span_5](start_span)[span_5](end_span) -->
        <div class="copyright">
          <p>  &copy; 2026꧁༺ 𝕄@ℍ𝕄𝕌𝔻𝕌𝕃 ℍ@𝕊@ℕ ༻꧂</p>
           <p>  সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </div>

    <script>
        const ACCESS_PASSWORD = 'M01763m&$@';

        function verifyPassword() {
            const enteredPass = document.getElementById('passInput').value;
            const errDiv = document.getElementById('passError');
            
            if (enteredPass === ACCESS_PASSWORD) {
                document.getElementById('password-overlay').style.display = 'none';
                document.getElementById('mainFormContainer').style.display = 'block';
            } else {
                errDiv.style.display = 'block';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') verifyPassword();
        }

        const form = document.getElementById('dataForm');
        const submitBtn = document.getElementById('submitBtn');
        const message = document.getElementById('message');

        // আপনার আসল URL অপরিবর্তিত রাখা হয়েছে[span_6](start_span)[span_6](end_span)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwTE4xz32QzxDrBkAuy2clOlTSwLBGQUYbdPDoRduawF7NC5FnmooMrEjKtL-DgxGvi8g/exec'; 

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.innerHTML = "জমা হচ্ছে...";
            submitBtn.disabled = true;

            let requestBody = new URLSearchParams(new FormData(form));
            
            fetch(scriptURL, { method: 'POST', body: requestBody })
                .then(response => {
                    message.style.display = "block"; 
                    form.reset(); 
                    submitBtn.innerHTML = "তথ্য জমা দিন";
                    submitBtn.disabled = false;
                    setTimeout(() => message.style.display = "none", 4000); 
                })
                .catch(error => {
                    alert('তথ্য জমা দিতে সমস্যা হয়েছে! কারণ: ' + error.message);
                    submitBtn.innerHTML = "তথ্য জমা দিন";
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>>
